# Render Blueprint — one-click deploy (use the "Deploy to Render" button in the README)
# First boot seeds demo data in the background (~1–2 min); health check passes immediately.
services:
  - type: web
    name: lm-compliance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
